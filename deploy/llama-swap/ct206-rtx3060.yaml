healthCheckTimeout: 600
logLevel: info
models:
  qwen2.5-vl-7b:
    cmd: '/opt/llama.cpp/build/bin/llama-server

      -m /opt/models/Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf

      --mmproj /opt/models/mmproj-Qwen2.5-VL-7B-Instruct-Q8_0.gguf

      -a qwen2.5-vl-7b

      -ngl 999 -fa off -c 8192 -t 8

      --jinja --reasoning-budget 0

      --image-max-tokens 2048 --mtmd-batch-max-tokens 2048

      --host 127.0.0.1 --port ${PORT}'
    env:
      - CUDA_VISIBLE_DEVICES=0
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - LD_LIBRARY_PATH=/usr/local/cuda-12.6/lib64
    ttl: 600
