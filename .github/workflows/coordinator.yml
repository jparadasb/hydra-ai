name: coordinator — build & deploy

# Builds the coordinator release image, pushes it to OCIR (multiarch), then bumps the image
# tag in the lambdatauri-cluster-fleet GitOps repo so Flux rolls it out.

on:
  push:
    branches: [main]
    paths:
      - 'coordinator/**'
      - '.github/workflows/coordinator.yml'
  pull_request:
    paths:
      - 'coordinator/**'
      - '.github/workflows/coordinator.yml'
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.OCI_REGION }}.ocir.io
  IMAGE: ${{ secrets.OCI_REGION }}.ocir.io/${{ secrets.OCI_TENANCY_NAMESPACE }}/${{ secrets.OCI_REPO_COORDINATOR || 'hydra-coordinator' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coordinator
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.19'
      - uses: actions/cache@v6
        with:
          path: |
            coordinator/deps
            coordinator/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('coordinator/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - run: mix deps.get
      - run: mix format --check-formatted

      # `mix coveralls` runs the suite and enforces the floor in `coveralls.json`, so this
      # replaces `mix test` rather than running alongside it.
      - run: mix coveralls

  # ---- the suite against Postgres -------------------------------------------------------------
  # Production runs Postgres and the suite only ever ran against SQLite, so the adapter that
  # actually serves users was compile-verified and nothing more. Same tests, real server.
  #
  # `DB_ADAPTER` is compile-time for the repo adapter, so it must be set for every step here —
  # including `mix test`, which compiles.
  test-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coordinator
    env:
      DB_ADAPTER: postgres
      COORDINATOR_TEST_DATABASE_URL: ecto://postgres:postgres@localhost:5432/coordinator_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coordinator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.19'
      - uses: actions/cache@v4
        with:
          path: |
            coordinator/deps
            coordinator/_build
          key: ${{ runner.os }}-mix-pg-${{ hashFiles('coordinator/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-pg-
      - run: mix deps.get

      # The e2e drives the real worker binary, so it needs one.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: worker
      - name: Build the worker binary
        working-directory: worker
        run: cargo build --locked -p worker-cli

      - run: mix test

  # ---- landing page CSS ---------------------------------------------------------------------
  # `coordinator/priv/site/tailwind.css` is generated but committed, and `npm run build:site`
  # never ran in CI — so editing `coordinator/assets/styles.css` and forgetting to rebuild
  # silently shipped stale CSS. Rebuild and fail if the committed file disagrees.
  site-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:site
      - name: Fail if the committed CSS is stale
        run: |
          if ! git diff --quiet -- coordinator/priv/site/tailwind.css; then
            echo "::error::coordinator/priv/site/tailwind.css is out of date."
            echo "Run 'npm run build:site' and commit the result."
            git --no-pager diff --stat -- coordinator/priv/site/tailwind.css
            exit 1
          fi
          echo "Committed CSS matches a fresh build."

  build-push:
    needs: test
    if: github.event_name != 'pull_request'
    # Native arm64 GitHub-hosted runner (the tauri cluster is arm64-only). Native avoids the
    # QEMU BEAM-JIT crash that killed `mix deps.compile` when emulating arm64 on an amd64 host.
    runs-on: ubuntu-24.04-arm
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Short SHA
        id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v4

      - name: Log in to OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.OCI_USERNAME }}
          password: ${{ secrets.OCI_AUTH_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: coordinator
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Coordinator image pushed" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}\`" >> $GITHUB_STEP_SUMMARY

  bump-fleet:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fleet repo
        uses: actions/checkout@v7
        with:
          repository: jparadasb/lambdatauri-cluster-fleet
          token: ${{ secrets.FLEET_GITHUB_TOKEN }}

      - name: Bump image tag in deployment.yaml
        env:
          SHA: ${{ needs.build-push.outputs.sha }}
        run: |
          sed -i "s|\(ocir\.io/[^/]*/hydra-coordinator\):.*|\1:${SHA}|g" \
            clusters/tauri/apps/hydra/deployment.yaml

      - name: Commit & push
        env:
          SHA: ${{ needs.build-push.outputs.sha }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add clusters/tauri/apps/hydra/deployment.yaml
          git diff --cached --quiet || git commit -m "chore: bump hydra-coordinator image to ${SHA}"
          git push
